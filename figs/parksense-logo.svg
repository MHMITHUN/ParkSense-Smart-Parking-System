<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="borderNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="3" y="3" width="122" height="122" rx="28" fill="url(#logoBgGrad)" stroke="url(#borderNeon)" stroke-width="2"/>
  
  <!-- Subtle Radar Grid -->
  <circle cx="64" cy="64" r="46" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 5" opacity="0.25"/>
  
  <!-- Parking Bay Indicator brackets -->
  <path d="M 28 42 L 38 42 L 38 86 L 28 86" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 100 42 L 90 42 L 90 86 L 100 86" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Sleek Modern P Monogram -->
  <path d="M 48 94 L 48 34 L 70 34 C 81 34 90 43 90 54 C 90 65 81 74 70 74 L 48 74" 
        stroke="url(#primaryNeon)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconGlow)"/>

  <!-- IoT Smart Sensor Ping Node -->
  <circle cx="70" cy="54" r="4.5" fill="#38bdf8"/>
  <circle cx="88" cy="90" r="4" fill="#10b981"/>
  <circle cx="88" cy="90" r="7.5" stroke="#10b981" stroke-width="1" opacity="0.5"/>
</svg>
