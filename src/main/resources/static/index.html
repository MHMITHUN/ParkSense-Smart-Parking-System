<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ParkSense — Smart Parking Control Room</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/parksense.css">
</head>
<body>
<header id="topbar">
    <div class="brand">
        <div class="brand-mark" title="ParkSense Enterprise Gateway">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="url(#topBrandGrad)" stroke-width="2" fill="none" />
                <path d="M9 17V7h4.5a3.5 3.5 0 0 1 0 7H9" stroke="url(#topBrandGrad)" stroke-width="2.4" />
                <circle cx="16.5" cy="16.5" r="1.5" fill="#38d9f5" />
                <defs>
                    <linearGradient id="topBrandGrad" x1="2.5" y1="2.5" x2="21.5" y2="21.5" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#38d9f5"/>
                        <stop offset="1" stop-color="#818cf8"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <span class="brand-name">PARK<b>SENSE</b></span>
        <span class="brand-sub">smart parking control room</span>
    </div>
    <nav id="nav" class="hidden">
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/map" data-route="map">Live Map</a>
        <a href="#/gates" data-route="gates">Gates</a>
        <a href="#/tickets" data-route="tickets">Tickets</a>
        <a href="#/members" data-route="members">Members</a>
        <a href="#/tariffs" data-route="tariffs">Tariffs</a>
        <a href="#/reports" data-route="reports">Reports</a>
        <a href="#/patterns" data-route="patterns">Patterns</a>
    </nav>
    <div class="top-right">
        <div class="clock-badge" title="Facility Current Time">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);flex-shrink:0">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="clock" class="clock mono">--:--:--</span>
        </div>
        <span id="user-chip" class="user-chip hidden"></span>
        <button id="logout-btn" class="logout-btn hidden" title="Sign out of control room">
            <span>Sign out</span>
            <svg class="logout-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </button>
    </div>
</header>

<main id="view"></main>

<div id="toasts"></div>
<div id="modal-root"></div>

<footer class="footer">
    <span>ParkSense Central Plaza · CSE 463 Software Design Pattern Make-up Assignment</span>
</footer>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/views/login.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/map.js"></script>
<script src="js/views/gates.js"></script>
<script src="js/views/tickets.js"></script>
<script src="js/views/members.js"></script>
<script src="js/views/tariffs.js"></script>
<script src="js/views/reports.js"></script>
<script src="js/views/patterns.js"></script>
<script src="js/router.js"></script>
</body>
</html>
